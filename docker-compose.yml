services:
  ahsd-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ahsd-assessment-system
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/ahsd.db
      - TZ=America/Sao_Paulo
    volumes:
      # Persistência permanente do banco de dados na máquina host
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
